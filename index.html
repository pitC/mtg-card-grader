<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Grader — Latest Set</title>
<style>
  :root{
    --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    --font-serif: ui-serif, Georgia, 'Times New Roman', serif;
    --bg: #12161a;
    --panel: #1a2027;
    --table-center: #262e37;
    --table-edge: #12161a;
    --ink: #eef2f4;
    --muted: #8fa0ac;
    --muted-dim: #5c6b76;
    --brass: #c99a44;
    --brass-bright: #e2b968;
    --brass-dim: #8a6a2f;
    --crimson: #a8425a;
    --line: rgba(255,255,255,0.08);
    --line-bright: rgba(255,255,255,0.16);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-mono);
    min-height: 100vh;
  }

  ::selection { background: var(--brass-dim); color: var(--ink); }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* ---------- Header ---------- */

  .header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }

  .set-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .set-icon {
    width: 26px;
    height: 26px;
    background-color: var(--brass);
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    flex-shrink: 0;
  }

  .set-name {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.01em;
  }

  .set-meta {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pill-group, .tab-group {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .pill-group button, .tab-group button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    border-radius: 999px;
    transition: background 0.15s, color 0.15s;
  }

  .pill-group button.active, .tab-group button.active {
    background: var(--brass-dim);
    color: var(--ink);
  }

  .progress {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .progress strong { color: var(--brass-bright); font-weight: 600; }

  /* ---------- Status states ---------- */

  .status-box {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .status-box .pulse {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--table-center), transparent 70%);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.4); opacity: 1; }
  }

  .status-box .retry {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--line-bright);
    color: var(--ink);
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 12px;
  }

  .setup-box {
    max-width: 440px;
    margin: 0 auto;
    text-align: left;
    line-height: 1.5;
  }

  .setup-box p {
    margin: 0 0 14px;
    font-size: 13px;
  }

  .setup-box a {
    color: var(--brass-bright);
  }

  .setup-input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line-bright);
    border-radius: 6px;
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 12px;
  }

  .setup-input:focus {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  .setup-hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted-dim);
  }

  .setup-hint code {
    color: var(--brass-bright);
    font-family: inherit;
  }

  .setup-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .setup-actions button {
    background: var(--panel);
    border: 1px solid var(--line-bright);
    color: var(--ink);
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 12px;
  }

  .setup-actions button.primary {
    background: var(--brass-dim);
    border-color: var(--brass);
    color: var(--ink);
  }

  /* ---------- Grade (single card) view ---------- */

  .light-table {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    border-radius: var(--radius);
    background: radial-gradient(ellipse at center, var(--table-center) 0%, var(--table-edge) 72%);
    border: 1px solid var(--line);
  }

  .card-wrap {
    position: relative;
    width: min(300px, 70vw);
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.55));
  }

  .card-wrap img {
    width: 100%;
    display: block;
    border-radius: 4.5% / 3.3%;
    background: var(--panel);
  }

  .seal {
    position: absolute;
    top: 45px;
    right: -14px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--brass);
    color: #1a1206;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-serif);
    font-weight: 900;
    font-size: 30px;
    border: 3px solid #12161a;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    transform: rotate(-9deg);
    animation: stamp 0.28s cubic-bezier(.2,1.6,.4,1);
  }

  @keyframes stamp {
    0% { transform: rotate(-9deg) scale(1.9); opacity: 0; }
    100% { transform: rotate(-9deg) scale(1); opacity: 1; }
  }

  .card-meta {
    text-align: center;
    margin-top: 22px;
  }

  .card-name {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 22px;
    margin-bottom: 4px;
  }

  .card-sub {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .grade-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 26px;
  }

  .grade-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--line-bright);
    background: var(--panel);
    color: var(--ink);
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 19px;
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
  }

  .grade-btn:hover {
    border-color: var(--brass);
    transform: translateY(-2px);
  }

  .grade-btn.active {
    background: var(--brass);
    color: #1a1206;
    border-color: var(--brass);
  }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 22px;
  }

  .nav-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 8px 4px;
    transition: color 0.15s;
  }

  .nav-btn:hover:not(:disabled) { color: var(--ink); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .clear-link {
    background: none;
    border: none;
    color: var(--crimson);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.75;
  }

  .clear-link:hover { opacity: 1; }

  .hint {
    text-align: center;
    color: var(--muted-dim);
    font-size: 10px;
    margin-top: 30px;
    letter-spacing: 0.04em;
  }

  /* ---------- Grid view ---------- */

  .grid-view {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
  }

  .grid-item {
    position: relative;
    border-radius: 4.5% / 3.3%;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 0;
    line-height: 0;
  }

  .grid-item img {
    width: 100%;
    display: block;
    opacity: 0.9;
    transition: opacity 0.15s, transform 0.15s;
  }

  .grid-item:hover img {
    opacity: 1;
    transform: scale(1.03);
  }

  .grid-item .mini-seal {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--brass);
    color: #1a1206;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  .empty-note {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- Analysis view ---------- */

  .analysis-filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 14px 20px;
    padding-bottom: 16px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .filter-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted-dim);
  }

  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    border: 1px solid var(--line-bright);
    background: var(--panel);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 6px 11px;
    border-radius: 999px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .chip:hover {
    border-color: var(--brass);
    color: var(--ink);
  }

  .chip.active {
    background: var(--brass-dim);
    border-color: var(--brass);
    color: var(--ink);
  }

  .chip.d-w { color: #e7ecf0; }
  .chip.d-u { color: #6fb3e8; }
  .chip.d-b { color: #cbb79a; }
  .chip.d-r { color: #e37b6c; }
  .chip.d-g { color: #85cf85; }
  .chip.d-c { color: #aab4bc; }
  .chip.d-w.active, .chip.d-u.active, .chip.d-b.active,
  .chip.d-r.active, .chip.d-g.active, .chip.d-c.active { color: var(--ink); }

  .reset-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--line-bright);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border-radius: 6px;
    align-self: flex-end;
  }

  .reset-btn:hover { color: var(--ink); border-color: var(--brass); }

  .search-input {
    min-width: 180px;
    background: var(--panel);
    border: 1px solid var(--line-bright);
    border-radius: 6px;
    color: var(--ink);
    font-family: inherit;
    font-size: 12px;
    padding: 7px 10px;
  }

  .search-input::placeholder {
    color: var(--muted-dim);
  }

  .search-input:focus {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  .lane { margin-bottom: 22px; }

  .lane-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }

  .lane-grade {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 16px;
    color: var(--brass-bright);
  }

  .lane-grade.muted { color: var(--muted-dim); }

  .lane-count {
    font-size: 11px;
    color: var(--muted-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .lane-track {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--table-center) transparent;
  }

  .lane-track::-webkit-scrollbar { height: 8px; }
  .lane-track::-webkit-scrollbar-thumb { background: var(--table-center); border-radius: 4px; }
  .lane-track::-webkit-scrollbar-track { background: transparent; }

  .lane-card {
    flex: 0 0 auto;
    width: 118px;
    border-radius: 4.5% / 3.3%;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 0;
    line-height: 0;
  }

  .lane-card img {
    width: 100%;
    display: block;
    opacity: 0.9;
    transition: opacity 0.15s, transform 0.15s;
  }

  .lane-card:hover img {
    opacity: 1;
    transform: scale(1.03);
  }

  .lane-empty {
    font-size: 11px;
    color: var(--muted-dim);
    padding: 14px 2px;
    letter-spacing: 0.04em;
  }

  /* ---------- Hover preview ---------- */

  .hover-card {
    position: fixed;
    z-index: 100;
    width: 280px;
    max-width: 38vw;
    pointer-events: none;
    border-radius: 4.5% / 3.3%;
    overflow: hidden;
    border: 1px solid var(--line-bright);
    background: var(--panel);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.65);
    line-height: 0;
  }

  .hover-card img {
    width: 100%;
    display: block;
  }

  /* Analysis mode is desktop-only */
  @media (max-width: 768px) {
    .tab-group button[data-tab="analysis"] { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse, .seal { animation: none; }
  }

  @media (max-width: 480px) {
    .header { flex-direction: column; align-items: flex-start; }
    .controls { width: 100%; justify-content: space-between; }
    .light-table { padding: 28px 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="set-info">
      <div class="set-icon" id="set-icon"></div>
      <div>
        <div class="set-name" id="set-name">Loading…</div>
        <div class="set-meta" id="set-meta">&nbsp;</div>
      </div>
    </div>
    <div class="controls">
      <div class="tab-group" id="tab-group">
        <button data-tab="grade" class="active">Grade</button>
        <button data-tab="grid">Grid</button>
        <button data-tab="analysis">Analysis</button>
      </div>
      <div class="pill-group" id="filter-group">
        <button data-filter="all" class="active">All</button>
        <button data-filter="ungraded">Ungraded</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="progress" id="sync-status">—</div>
    </div>
  </div>

  <div id="status" class="status-box">
    <div class="pulse"></div>
    Loading…
  </div>

  <div id="grade-view" style="display:none;">
    <div id="grade-empty" class="empty-note" style="display:none;"></div>
    <div id="grade-content">
      <div class="light-table">
        <div class="card-wrap">
          <img id="card-image" src="" alt="">
          <div class="seal" id="seal" style="display:none;"></div>
        </div>
      </div>
      <div class="card-meta">
        <div class="card-name" id="card-name"></div>
        <div class="card-sub" id="card-sub"></div>
      </div>
      <div class="grade-row" id="grade-row">
        <button class="grade-btn" data-grade="A">A</button>
        <button class="grade-btn" data-grade="B">B</button>
        <button class="grade-btn" data-grade="C">C</button>
        <button class="grade-btn" data-grade="D">D</button>
        <button class="grade-btn" data-grade="E">E</button>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prev-btn">‹ Prev</button>
        <button class="clear-link" id="clear-btn">Clear grade</button>
        <button class="nav-btn" id="next-btn">Next ›</button>
      </div>
      <div class="hint">Keys: A B C D E to grade · ← → to move</div>
    </div>
  </div>

  <div id="grid-view" class="grid-view" style="display:none;"></div>

  <div id="analysis-view" style="display:none;">
    <div id="analysis-filters" class="analysis-filters"></div>
    <div id="analysis-lanes"></div>
  </div>

  <div id="hover-card" class="hover-card" style="display:none;">
    <img id="hover-card-img" src="" alt="">
  </div>
</div>

<script type="module">
(function () {
  'use strict';

  const COLLECTION_KEY = 'scryfallCardGraderFirestoreCollection';
  const FIRESTORE_SKIPPED_KEY = 'scryfallCardGraderFirestoreSkipped';
  const LEGACY_LOCAL_KEY = 'scryfallCardGraderGrades';
  const LOCAL_KEY_PREFIX = 'scryfallCardGraderGrades:';
  const GRADES = ['A', 'B', 'C', 'D', 'E'];
  const ANALYSIS_COLOR_VALUES = [
    { value: 'W', cls: 'd-w' },
    { value: 'U', cls: 'd-u' },
    { value: 'B', cls: 'd-b' },
    { value: 'R', cls: 'd-r' },
    { value: 'G', cls: 'd-g' },
    { value: 'C', cls: 'd-c' },
  ];
  const ANALYSIS_RARITY_VALUES = ['common', 'uncommon', 'rare', 'mythic', 'special', 'bonus'];
  const FIREBASE_VERSION = '12.17.1';
  const firebaseConfig = {
    apiKey: 'AIzaSyAUReVkoQ1fSSztd8cQXHmtyMNFUQS2hk0',
    authDomain: 'mtg-card-grader.firebaseapp.com',
    projectId: 'mtg-card-grader',
    storageBucket: 'mtg-card-grader.firebasestorage.app',
    messagingSenderId: '479390474930',
    appId: '1:479390474930:web:297c0047064abdc1031fab',
  };
  let firestoreApiPromise = null;

  const state = {
    setCode: null,
    cards: [],
    filtered: [],
    index: 0,
    filter: 'all',
    tab: 'grade',
    grades: {},
    collectionKey: null,
    cloudSync: false,
    analysisFilters: { grades: [], colors: [], rarities: [], query: '' },
  };

  const el = {
    status: document.getElementById('status'),
    gradeView: document.getElementById('grade-view'),
    gradeContent: document.getElementById('grade-content'),
    gradeEmpty: document.getElementById('grade-empty'),
    gridView: document.getElementById('grid-view'),
    setName: document.getElementById('set-name'),
    setMeta: document.getElementById('set-meta'),
    setIcon: document.getElementById('set-icon'),
    progress: document.getElementById('progress'),
    cardImage: document.getElementById('card-image'),
    cardName: document.getElementById('card-name'),
    cardSub: document.getElementById('card-sub'),
    seal: document.getElementById('seal'),
    gradeRow: document.getElementById('grade-row'),
    prevBtn: document.getElementById('prev-btn'),
    nextBtn: document.getElementById('next-btn'),
    clearBtn: document.getElementById('clear-btn'),
    tabGroup: document.getElementById('tab-group'),
    filterGroup: document.getElementById('filter-group'),
    syncStatus: document.getElementById('sync-status'),
    analysisView: document.getElementById('analysis-view'),
    analysisFilters: document.getElementById('analysis-filters'),
    analysisLanes: document.getElementById('analysis-lanes'),
    analysisSearch: document.getElementById('analysis-search'),
    hoverCard: document.getElementById('hover-card'),
    hoverCardImg: document.getElementById('hover-card-img'),
  };

  function parseStoredGrades(value) {
    try {
      const grades = JSON.parse(value);
      return grades && typeof grades === 'object' && !Array.isArray(grades) ? grades : {};
    } catch (e) {
      return {};
    }
  }

  function localCacheKey(setCode) {
    return `${LOCAL_KEY_PREFIX}${setCode}`;
  }

  function loadLocalCache() {
    if (!state.setCode) return {};

    const stored = localStorage.getItem(localCacheKey(state.setCode));
    if (stored !== null) return parseStoredGrades(stored);

    // Migrate cards for this set from the original cross-set cache. Keep the
    // legacy cache so other sets can migrate when they are opened later.
    const legacyGrades = parseStoredGrades(localStorage.getItem(LEGACY_LOCAL_KEY));
    const cardIds = new Set(state.cards.map(card => card.id));
    const migrated = Object.fromEntries(
      Object.entries(legacyGrades).filter(([cardId]) => cardIds.has(cardId))
    );
    localStorage.setItem(localCacheKey(state.setCode), JSON.stringify(migrated));
    return migrated;
  }

  function saveLocalCache() {
    if (!state.setCode) return;
    localStorage.setItem(localCacheKey(state.setCode), JSON.stringify(state.grades));
  }

  function loadStoredCollectionKey() {
    return localStorage.getItem(COLLECTION_KEY);
  }

  function saveStoredCollectionKey(collectionKey) {
    localStorage.setItem(COLLECTION_KEY, collectionKey);
    localStorage.removeItem(FIRESTORE_SKIPPED_KEY);
  }

  function markFirestoreSkipped() {
    localStorage.setItem(FIRESTORE_SKIPPED_KEY, '1');
    localStorage.removeItem(COLLECTION_KEY);
  }

  function isFirestoreSkipped() {
    return localStorage.getItem(FIRESTORE_SKIPPED_KEY) === '1';
  }

  function normalizeCollectionKey(input) {
    const trimmed = input.trim();
    return trimmed && !trimmed.includes('/') ? trimmed : null;
  }

  async function getFirestoreApi() {
    if (!firestoreApiPromise) {
      firestoreApiPromise = Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`),
      ]).then(([firebaseApp, firestore]) => ({
        db: firestore.getFirestore(firebaseApp.initializeApp(firebaseConfig)),
        doc: firestore.doc,
        getDoc: firestore.getDoc,
        setDoc: firestore.setDoc,
      }));
    }
    return firestoreApiPromise;
  }

  function useLocalSyncOnly(reason) {
    state.cloudSync = false;
    state.collectionKey = null;
    setSyncStatus(reason || 'Local only');
  }

  function showFirestoreSetup() {
    return new Promise(resolve => {
      el.status.style.display = 'block';
      el.status.innerHTML = `
        <div class="setup-box">
          <p>Sync grades across devices with the shared collection key from the webpage owner, or keep them in this browser only.</p>
          <input class="setup-input" id="collection-input" type="password" placeholder="Enter the shared collection key" autocomplete="off" spellcheck="false">
          <div class="setup-hint">
            Ask the webpage owner for the key. Each set is stored in its own Firestore document.
            Leave the key unshared except with people who should be able to read and update these grades.
          </div>
          <div class="setup-actions">
            <button class="primary" id="collection-save">Save &amp; sync</button>
            <button id="firestore-skip">Skip (local only)</button>
          </div>
        </div>
      `;

      const input = document.getElementById('collection-input');
      input.focus();

      document.getElementById('collection-save').addEventListener('click', () => {
        const collectionKey = normalizeCollectionKey(input.value);
        if (!collectionKey) {
          input.setCustomValidity('Enter a collection key without slashes.');
          input.reportValidity();
          input.focus();
          return;
        }
        input.setCustomValidity('');
        saveStoredCollectionKey(collectionKey);
        resolve(collectionKey);
      });

      document.getElementById('firestore-skip').addEventListener('click', () => {
        markFirestoreSkipped();
        resolve(null);
      });

      input.addEventListener('keydown', e => {
        input.setCustomValidity('');
        if (e.key === 'Enter') document.getElementById('collection-save').click();
      });
    });
  }

  async function ensureSyncConfig() {
    let collectionKey = loadStoredCollectionKey();
    if (!collectionKey && !isFirestoreSkipped()) {
      collectionKey = await showFirestoreSetup();
    }

    if (collectionKey) {
      state.collectionKey = collectionKey;
      state.cloudSync = true;
      return;
    }

    useLocalSyncOnly('Local only');
  }

  function setSyncStatus(text) {
    el.syncStatus.textContent = text;
  }

  // Firestore sync when configured; otherwise per-set local storage only.
  async function fetchAllGrades() {
    const localGrades = loadLocalCache();
    if (!state.cloudSync || !state.collectionKey) {
      state.grades = localGrades;
      setSyncStatus('Local only');
      return;
    }

    setSyncStatus('Syncing…');
    try {
      const { db, doc, getDoc } = await getFirestoreApi();
      const snapshot = await getDoc(doc(db, state.collectionKey, state.setCode));
      state.grades = snapshot.exists() ? snapshot.data() : {};
      saveLocalCache();
      setSyncStatus('Synced');
    } catch (e) {
      console.error('[Card Grader] Firestore sync error', e);
      useLocalSyncOnly('Local only (sync failed)');
      state.grades = localGrades;
    }
  }

  // Each Firestore document contains the complete grade map for one set.
  async function persistGrades() {
    saveLocalCache();
    if (!state.cloudSync || !state.collectionKey) {
      setSyncStatus('Local only');
      return;
    }

    setSyncStatus('Saving…');
    try {
      const { db, doc, setDoc } = await getFirestoreApi();
      await setDoc(doc(db, state.collectionKey, state.setCode), state.grades);
      setSyncStatus('Synced');
    } catch (e) {
      console.error('[Card Grader] Firestore sync error', e);
      useLocalSyncOnly('Local only (sync failed)');
    }
  }

  function cardImageUrl(card, size) {
    size = size || 'normal';
    if (card.image_uris) return card.image_uris[size] || card.image_uris.normal || '';
    if (card.card_faces && card.card_faces[0].image_uris) {
      const uris = card.card_faces[0].image_uris;
      return uris[size] || uris.normal || '';
    }
    return '';
  }

  async function fetchJson(url) {
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('Request failed: ' + res.status);
    return res.json();
  }

  function getSetCodeFromUrl() {
    const code = new URLSearchParams(location.search).get('set');
    return code ? code.trim().toLowerCase() : null;
  }

  async function fetchSetByCode(code) {
    return fetchJson(`https://api.scryfall.com/sets/${encodeURIComponent(code)}`);
  }

  async function findLatestSet() {
    const data = await fetchJson('https://api.scryfall.com/sets');
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const oneMonthAgo = new Date(today);
    oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
    const oneMonthFromNow = new Date(today);
    oneMonthFromNow.setMonth(oneMonthFromNow.getMonth() + 1);

    const toDateStr = d =>
      `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const minDate = toDateStr(oneMonthAgo);
    const maxDate = toDateStr(oneMonthFromNow);

    const candidates = data.data.filter(s =>
      s.card_count > 0 &&
      s.released_at &&
      s.released_at >= minDate &&
      s.released_at <= maxDate &&
      s.set_type !== 'token' &&
      s.set_type !== 'memorabilia'
    );
    candidates.sort((a, b) => b.released_at.localeCompare(a.released_at));
    return candidates[0];
  }

  async function fetchSetCards(code) {
    let url = `https://api.scryfall.com/cards/search?q=e%3A${code}&order=set&unique=cards`;
    let all = [];
    while (url) {
      const page = await fetchJson(url);
      all = all.concat(page.data);
      url = page.has_more ? page.next_page : null;
      if (url) await new Promise(r => setTimeout(r, 80));
    }
    return all.filter(c => cardImageUrl(c));
  }

  function applyFilter() {
    state.filtered = state.filter === 'ungraded'
      ? state.cards.filter(c => !state.grades[c.id])
      : state.cards;
    if (state.index >= state.filtered.length) state.index = Math.max(0, state.filtered.length - 1);
  }

  function updateProgress() {
    const gradedCount = state.cards.filter(c => state.grades[c.id]).length;
    el.progress.innerHTML = `<strong>${gradedCount}</strong> / ${state.cards.length} graded`;
  }

  function renderGradeView() {
    if (!state.filtered.length) {
      el.gradeContent.style.display = 'none';
      el.gradeEmpty.style.display = 'block';
      el.gradeEmpty.textContent = state.filter === 'ungraded'
        ? 'Every card in this set has a grade. Switch to "All" to review them.'
        : 'No cards to show.';
      return;
    }

    el.gradeContent.style.display = 'block';
    el.gradeEmpty.style.display = 'none';

    const card = state.filtered[state.index];
    if (!card) return;
    const grade = state.grades[card.id];

    el.cardImage.src = cardImageUrl(card);
    el.cardImage.alt = card.name;
    el.cardName.textContent = card.name;
    el.cardSub.textContent = `${card.rarity.toUpperCase()} · #${card.collector_number} · ${card.type_line || ''}`;

    if (grade) {
      el.seal.style.display = 'flex';
      el.seal.textContent = grade.grade;
    } else {
      el.seal.style.display = 'none';
    }

    [...el.gradeRow.children].forEach(btn => {
      btn.classList.toggle('active', grade && grade.grade === btn.dataset.grade);
    });

    el.prevBtn.disabled = state.index === 0;
    el.nextBtn.disabled = state.index === state.filtered.length - 1;
  }

  function renderGridView() {
    hideHoverCard();
    el.gridView.innerHTML = '';
    if (!state.filtered.length) {
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.style.gridColumn = '1 / -1';
      note.textContent = state.filter === 'ungraded'
        ? 'Every card in this set has a grade.'
        : 'No cards to show.';
      el.gridView.appendChild(note);
      return;
    }
    state.filtered.forEach((card, i) => {
      const item = document.createElement('button');
      item.className = 'grid-item';
      item._card = card;
      const img = document.createElement('img');
      img.src = cardImageUrl(card);
      img.alt = card.name;
      img.loading = 'lazy';
      item.appendChild(img);
      const grade = state.grades[card.id];
      if (grade) {
        const mini = document.createElement('div');
        mini.className = 'mini-seal';
        mini.textContent = grade.grade;
        item.appendChild(mini);
      }
      item.addEventListener('click', () => {
        state.index = i;
        setTab('grade');
      });
      el.gridView.appendChild(item);
    });
  }

  function cardGrade(card) {
    return state.grades[card.id] ? state.grades[card.id].grade : null;
  }

  function analysisMatches(card) {
    const f = state.analysisFilters;

    if (f.grades.length && !f.grades.includes(cardGrade(card))) return false;

    if (f.colors.length) {
      const colors = card.colors || [];
      const wantsColorless = f.colors.includes('C');
      const colorHits = f.colors.filter(c => c !== 'C').some(c => colors.includes(c));
      const isColorless = colors.length === 0;
      if (!(wantsColorless && isColorless) && !colorHits) return false;
    }

    if (f.rarities.length && !f.rarities.includes(card.rarity)) return false;

    if (f.query) {
      const q = f.query.toLowerCase();
      const nameHit = (card.name || '').toLowerCase().includes(q);
      const typeHit = (card.type_line || '').toLowerCase().includes(q);
      if (!nameHit && !typeHit) return false;
    }

    return true;
  }

  function buildAnalysisFilterBar() {
    const searchGroup = document.createElement('div');
    searchGroup.className = 'filter-group';

    const searchLabel = document.createElement('span');
    searchLabel.className = 'filter-label';
    searchLabel.textContent = 'Search';
    searchGroup.appendChild(searchLabel);

    const searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.className = 'search-input';
    searchInput.id = 'analysis-search';
    searchInput.placeholder = 'Card name or type…';
    searchInput.autocomplete = 'off';
    searchInput.spellcheck = false;
    searchInput.addEventListener('input', () => {
      state.analysisFilters.query = searchInput.value.trim();
      renderAnalysisView();
    });
    searchGroup.appendChild(searchInput);
    el.analysisFilters.appendChild(searchGroup);

    const groups = [
      {
        key: 'grades',
        label: 'Grade',
        values: GRADES.concat(['ungraded']).map(v => ({ value: v, cls: '' })),
      },
      { key: 'colors', label: 'Colour', values: ANALYSIS_COLOR_VALUES },
      {
        key: 'rarities',
        label: 'Rarity',
        values: ANALYSIS_RARITY_VALUES.map(v => ({ value: v, cls: '' })),
      },
    ];

    groups.forEach(g => {
      const groupEl = document.createElement('div');
      groupEl.className = 'filter-group';

      const label = document.createElement('span');
      label.className = 'filter-label';
      label.textContent = g.label;
      groupEl.appendChild(label);

      const chips = document.createElement('div');
      chips.className = 'chips';
      g.values.forEach(v => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip' + (v.cls ? ' ' + v.cls : '');
        btn.dataset.group = g.key;
        btn.dataset.value = v.value;
        btn.textContent = v.value.toUpperCase();
        chips.appendChild(btn);
      });
      groupEl.appendChild(chips);
      el.analysisFilters.appendChild(groupEl);
    });

    const reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'reset-btn';
    reset.textContent = 'Reset filters';
    el.analysisFilters.appendChild(reset);
  }

  function syncAnalysisChips() {
    [...el.analysisFilters.querySelectorAll('button.chip')].forEach(btn => {
      btn.classList.toggle('active', state.analysisFilters[btn.dataset.group].includes(btn.dataset.value));
    });
  }

  function renderAnalysisView() {
    hideHoverCard();
    const filtered = state.cards.filter(analysisMatches);
    const lanes = [
      ...GRADES.map(g => ({ label: g, cards: filtered.filter(c => cardGrade(c) === g) })),
      { label: 'Ungraded', cards: filtered.filter(c => !cardGrade(c)) },
    ];

    el.analysisLanes.innerHTML = '';
    lanes.forEach(lane => {
      const laneEl = document.createElement('div');
      laneEl.className = 'lane';

      const head = document.createElement('div');
      head.className = 'lane-head';
      const grade = document.createElement('span');
      grade.className = 'lane-grade' + (lane.label === 'Ungraded' ? ' muted' : '');
      grade.textContent = lane.label;
      const count = document.createElement('span');
      count.className = 'lane-count';
      count.textContent = `${lane.cards.length} ${lane.cards.length === 1 ? 'card' : 'cards'}`;
      head.appendChild(grade);
      head.appendChild(count);
      laneEl.appendChild(head);

      const track = document.createElement('div');
      track.className = 'lane-track';
      if (!lane.cards.length) {
        const empty = document.createElement('div');
        empty.className = 'lane-empty';
        empty.textContent = 'No cards match';
        track.appendChild(empty);
      } else {
        lane.cards.forEach(card => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'lane-card';
          btn.title = card.name;
          btn._card = card;
          const img = document.createElement('img');
          img.src = cardImageUrl(card);
          img.alt = card.name;
          img.loading = 'lazy';
          btn.appendChild(img);
          btn.addEventListener('click', () => {
            state.filter = 'all';
            state.index = state.cards.indexOf(card);
            setTab('grade');
          });
          track.appendChild(btn);
        });
      }
      laneEl.appendChild(track);
      el.analysisLanes.appendChild(laneEl);
    });
  }

  function render() {
    applyFilter();
    updateProgress();
    if (state.tab === 'grade') renderGradeView();
    else if (state.tab === 'grid') renderGridView();
    else renderAnalysisView();
  }

  function setTab(tab) {
    state.tab = tab;
    [...el.tabGroup.children].forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    el.gradeView.style.display = tab === 'grade' ? 'block' : 'none';
    el.gridView.style.display = tab === 'grid' ? 'grid' : 'none';
    el.analysisView.style.display = tab === 'analysis' ? 'block' : 'none';
    render();
  }

  function setFilter(filter) {
    state.filter = filter;
    state.index = 0;
    [...el.filterGroup.children].forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
    render();
  }

  async function gradeCurrentCard(grade) {
    if (!state.filtered.length) return;
    const card = state.filtered[state.index];
    state.grades[card.id] = {
      cardName: card.name,
      grade,
      gradedAt: new Date().toISOString(),
    };
    render();
    await persistGrades();
  }

  async function clearCurrentCard() {
    if (!state.filtered.length) return;
    const card = state.filtered[state.index];
    delete state.grades[card.id];
    render();
    await persistGrades();
  }

  function move(delta) {
    const next = state.index + delta;
    if (next >= 0 && next < state.filtered.length) {
      state.index = next;
      render();
    }
  }

  el.tabGroup.addEventListener('click', e => {
    const btn = e.target.closest('button[data-tab]');
    if (btn) setTab(btn.dataset.tab);
  });

  el.filterGroup.addEventListener('click', e => {
    const btn = e.target.closest('button[data-filter]');
    if (btn) setFilter(btn.dataset.filter);
  });

  el.gradeRow.addEventListener('click', e => {
    const btn = e.target.closest('button[data-grade]');
    if (btn) gradeCurrentCard(btn.dataset.grade);
  });

  el.prevBtn.addEventListener('click', () => move(-1));
  el.nextBtn.addEventListener('click', () => move(1));
  el.clearBtn.addEventListener('click', clearCurrentCard);

  el.analysisFilters.addEventListener('click', e => {
    const chip = e.target.closest('button.chip');
    if (chip) {
      const arr = state.analysisFilters[chip.dataset.group];
      const idx = arr.indexOf(chip.dataset.value);
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push(chip.dataset.value);
      syncAnalysisChips();
      renderAnalysisView();
      return;
    }
    if (e.target.closest('.reset-btn')) {
      state.analysisFilters = { grades: [], colors: [], rarities: [], query: '' };
      if (el.analysisSearch) el.analysisSearch.value = '';
      syncAnalysisChips();
      renderAnalysisView();
    }
  });

  const hoverSupported = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(hover: hover)').matches;

  function showHoverCard(card, x, y) {
    el.hoverCardImg.src = cardImageUrl(card, 'large');
    el.hoverCardImg.alt = card.name;
    el.hoverCard.style.display = 'block';
    positionHoverCard(x, y);
  }

  function hideHoverCard() {
    el.hoverCard.style.display = 'none';
  }

  function positionHoverCard(x, y) {
    const preview = el.hoverCard;
    const w = preview.offsetWidth;
    const h = preview.offsetHeight;
    let left = x + 18;
    if (left + w > window.innerWidth - 8) left = x - w - 18;
    let top = y - h / 2;
    top = Math.max(8, Math.min(top, window.innerHeight - h - 8));
    preview.style.left = left + 'px';
    preview.style.top = top + 'px';
  }

  if (hoverSupported) {
    document.addEventListener('mouseover', e => {
      const item = e.target.closest('.lane-card, .grid-item');
      if (!item || !item._card) return;
      showHoverCard(item._card, e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', e => {
      if (el.hoverCard.style.display === 'block') positionHoverCard(e.clientX, e.clientY);
    });
    document.addEventListener('mouseout', e => {
      const item = e.target.closest('.lane-card, .grid-item');
      if (!item) return;
      if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.lane-card, .grid-item')) return;
      hideHoverCard();
    });
  }

  document.addEventListener('keydown', e => {
    if (state.tab !== 'grade') return;
    const key = e.key.toUpperCase();
    if (GRADES.includes(key)) gradeCurrentCard(key);
    else if (e.key === 'ArrowLeft') move(-1);
    else if (e.key === 'ArrowRight') move(1);
  });

  async function init() {
    try {
      await ensureSyncConfig();
      const requestedSet = getSetCodeFromUrl();
      el.status.innerHTML = requestedSet
        ? `<div class="pulse"></div>Fetching set “${requestedSet}” from Scryfall…`
        : '<div class="pulse"></div>Fetching the latest set from Scryfall…';

      const set = requestedSet
        ? await fetchSetByCode(requestedSet)
        : await findLatestSet();
      if (!set) throw new Error('No suitable set found');
      state.setCode = set.code;

      document.title = `Card Grader — ${set.name}`;
      el.setName.textContent = set.name;
      el.setMeta.textContent = `${set.released_at}`;
      if (set.icon_svg_uri) el.setIcon.style.maskImage = el.setIcon.style.webkitMaskImage = `url("${set.icon_svg_uri}")`;

      const cards = await fetchSetCards(set.code);
      if (!cards.length) throw new Error('No cards with images found in this set');
      state.cards = cards;

      buildAnalysisFilterBar();

      await fetchAllGrades();

      el.status.style.display = 'none';
      el.gradeView.style.display = 'block';
      render();
    } catch (err) {
      el.status.innerHTML = `
        <div>Could not load a set from Scryfall.</div>
        <div style="font-size:11px; margin-top:6px; color: var(--muted-dim);">${err.message}</div>
        <button class="retry" id="retry-btn">Retry</button>
      `;
      document.getElementById('retry-btn').addEventListener('click', () => {
        const requestedSet = getSetCodeFromUrl();
        el.status.innerHTML = requestedSet
          ? `<div class="pulse"></div>Fetching set “${requestedSet}” from Scryfall…`
          : '<div class="pulse"></div>Fetching the latest set from Scryfall…';
        init();
      });
    }
  }

  init();
})();
</script>

</body>
</html>
