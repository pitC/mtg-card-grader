<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Grader</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>

<div class="app">
  <div class="header" id="app-header">
    <div class="set-info">
      <div class="set-icon" id="set-icon"></div>
      <div>
        <div class="set-name" id="set-name">Loading…</div>
        <div class="set-meta" id="set-meta">&nbsp;</div>
      </div>
    </div>
    <div class="controls">
      <div class="tab-group" id="tab-group">
        <button data-tab="grade" class="active">Grade</button>
        <button data-tab="grid">Grid</button>
      </div>
      <button class="sync-key-btn" id="sync-key-btn" type="button" title="Sync id used for this set's grades — click to change">No sync</button>
      <div class="progress" id="progress"></div>
      <div class="progress" id="sync-status">—</div>
    </div>
  </div>

  <div id="status" class="status-box">
    <div class="pulse"></div>
    Loading…
  </div>

  <div id="set-select-view" class="set-select-view" style="display:none;">
    <div class="set-select-title">Card Grader</div>
    <p class="set-select-sub">Pick a set to grade, or search for any expansion set by name.</p>
    <input id="set-search" class="setup-input" type="search" placeholder="Search sets by name…" autocomplete="off" spellcheck="false">
    <div id="set-search-results" class="set-search-results" style="display:none;"></div>
    <div id="set-search-info" class="set-search-info" style="display:none;"></div>

    <div id="set-recent-section">
      <div class="set-select-label">Suggestions</div>
      <div id="recent-sets-loading" class="set-loading">
        <div class="pulse"></div>
        <span>Loading sets from Scryfall…</span>
      </div>
      <div id="recent-sets" class="recent-sets"></div>
      <div id="recent-sets-empty" class="empty-note" style="display:none;">No sets available.</div>
    </div>
  </div>

  <div id="grade-view" style="display:none;">
    <div id="grade-empty" class="empty-note" style="display:none;"></div>
    <div id="grade-content">
      <div class="light-table">
        <div id="card-wrap" class="card-wrap">
          <img id="card-image" src="" alt="">
          <div class="seal" id="seal" style="display:none;"></div>
        </div>
      </div>
      <div class="card-meta">
        <div class="card-name" id="card-name"></div>
        <div class="card-sub" id="card-sub"></div>
      </div>
      <div class="grade-row" id="grade-row">
        <button class="grade-btn" data-grade="A">A</button>
        <button class="grade-btn" data-grade="B">B</button>
        <button class="grade-btn" data-grade="C">C</button>
        <button class="grade-btn" data-grade="D">D</button>
        <button class="grade-btn" data-grade="E">E</button>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prev-btn">‹ Prev</button>
        <button class="clear-link" id="clear-btn">Clear grade</button>
        <button class="nav-btn" id="next-btn">Next ›</button>
      </div>
      <div class="hint">Use the buttons to grade and navigate between cards.</div>
    </div>
  </div>

  <div id="grid-view" style="display:none;">
    <div class="grid-search-row"></div>
    <div class="grid-toolbar">
      <button id="compare-btn" class="compare-btn" type="button">Compare vs 17Lands</button>
      <span id="compare-status" class="compare-status"></span>
    </div>
    <div id="compare-summary" class="compare-summary" style="display:none;"></div>
    <div id="grid-filters" class="grid-filters"></div>
    <div id="grid-lanes"></div>
  </div>

  <div id="hover-card" class="hover-card" style="display:none;">
    <img id="hover-card-img" src="" alt="">
  </div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
